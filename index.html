<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Agent</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}
.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:white;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}
.chat{
  height:70vh;
  padding:15px;
  overflow:auto;
}
.msg{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  max-width:85%;
}
.bot{
  background:#e5e7eb;
}
.user{
  background:#2563eb;
  color:white;
  margin-left:auto;
}
.bottom{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
}
input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
button{
  margin-left:8px;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>
<div class="app">

<header>🤖 My AI Agent</header>

<div class="chat" id="chat">
  <div class="msg bot">
    Namaste! 👋 Main tumhara AI Assistant hoon.<br>
    Mujhse kuch bhi poochho.
  </div>
</div>

<div class="bottom">
  <input id="input" placeholder="Kuch poochho..." />
  <button onclick="send()">Send</button>
</div>

</div>

<<script>
async function send(){

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();

  if(!text) return;

  chat.innerHTML +=
    '<div class="msg user">' + text + '</div>';

  input.value = "";

  chat.innerHTML +=
    '<div class="msg bot" id="loading">सोच रहा हूँ... 🤖</div>';

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    document.getElementById("loading").remove();

    if (!response.ok) {
      throw new Error(data.error || "AI error");
    }

    chat.innerHTML +=
      '<div class="msg bot">' +
      (data.reply || "AI से जवाब नहीं मिला।") +
      '</div>';

  } catch (error) {

    document.getElementById("loading").remove();

    chat.innerHTML +=
      '<div class="msg bot">माफ़ कीजिए, AI से connection नहीं हो पाया। 🤖</div>';

    console.error(error);
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
